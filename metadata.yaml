# 运行环境要求：Python 3.12+（与 AstrBot 最低要求一致）；AstrBot 版本范围在下方 astrbot_version 正式声明
name: astrbot_plugin_weave_memory
display_name: 织忆
desc: 本地优先的 AstrBot 记忆引擎：默认登记、可随时关闭，支持 Personal Agent 读写工具、命令管理、SQLite+FTS5 检索、私聊与群聊上下文注入
short_desc: 默认登记、可关闭的本地记忆引擎
help: |
  [默认] 个人记忆默认开启；首次私聊自动登记并给一次告知
  [织忆 帮助] 查看个人记忆命令
  [织忆 授权] 显式开启个人记忆（仅在 auto_enroll=false 或撤销后需要）
  [织忆 撤销授权] 停止保存、检索和注入，已有数据保留；auto_enroll 不会自动复活
  [织忆 保存 内容] 显式保存一条事实
  [织忆 更新 记忆ID 当前revision 新内容] 修订指定记忆，revision 不匹配时拒绝覆盖
  [织忆 列表] 查看已保存的个人记忆
  [织忆 查询 问题] 主动检索个人记忆
  [织忆 状态] 查看个人空间、授权、记忆数量与索引状态
  [织忆 统计] 查看记忆状态、类型、来源数量
  [织忆 操作记录] 查看不含正文的操作审计
  [织忆 导出 json|md [all]] 导出当前个人空间 ACTIVE 记忆；all 附带其他状态元数据
  [织忆 导入 [dry-run]] 附 v2 JSON 导出文件导入；dry-run 只预演
  [织忆 导入 回滚 任务ID] 删除该任务本次新建的记忆
  [群导入/群导出 V1.7] 群管理员；/织忆 群导入 [dry-run]、/织忆 群导出 [json|md] [all]、/织忆 群导入 回滚 任务ID
  [织忆 删除 记忆ID 确认] 二次确认后不可恢复地删除一条记忆
  [织忆 清空 确认] 不可恢复地清空个人记忆
  [织忆 关闭 确认] 永久关闭个人记忆空间（数据保留，当前版本不支持重新开启）
  [Agent 工具] weave_memory_search/get/list/history 仅访问当前用户 Personal Scope；weave_memory_remember/update 已启用写入，来源记录插件侧 evidence_ref（message/session + 内容哈希），不冒充宿主 tool_call_id
  [群命令] 群聊内发送 /织忆 群帮助 查看；群开启/群关闭/群清空/群销毁/群保存仅群管理员，成员可读 群列表/群查询/群状态
  [提取命令 V1.5] 默认关闭；/织忆 提取 开启 <capture|auto_extract|external_model|store_candidate|全部>；/织忆 提取 状态；/织忆 候选 列表/确认/拒绝
  [候选 V1.6] 候选默认 7 天有效（candidate_ttl_days）；过期在读取列表时转归档；拒绝默认清除正文，只保留审计
  [管理 API V1.6/V1.7/V1.8] 插件路由 /astrbot_plugin_weave_memory/v1/{overview|candidates|memories|groups|retrieval/debug|settings|maintenance/status|export|import|maintenance/backup|maintenance/restore|maintenance/reindex}；只读端点需 dashboard 登录，export/import 与 maintenance/* 需非空 api_admin_usernames 白名单
  [备份 V1.8] /织忆 备份 [列表] 创建/查看主库快照；账本独立保存，备份不含账本
  [恢复 V1.8] /织忆 恢复 <备份ID> [merge|revert|disaster-rebuild] 确认；不带确认即 dry-run，旧备份按 ledger 排除删除/清空/撤销授权
  触发：个人命令仅私聊生效，群命令仅群聊生效；统一前缀 /织忆
  状态：开发预览 v1.0.0-dev.1，未正式发版；V1.8 核心已实现，真实宿主 v8→v9 迁移、备份/恢复与维护 API 烟测已通过
